name: Проверка сайта

on:
  push:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - name: Тесты инструментов сборки
        run: python tools/test_tools.py
      - name: Объяснения ошибок Python, Flask и SQLite срабатывают и переведены
        run: python tools/check_errors.py
      - name: Ссылки, заголовки, карта сайта
        run: python tools/check_site.py
      - name: Шапка и подвал совпадают с tools/layout.py
        run: python tools/layout.py --check
      - name: Примеры кода
        run: python tools/check_examples.py
      - name: Эталонные решения задач проходят тесты
        run: python tools/check_tasks.py
      - name: Задачи на страницах совпадают с tools/build_practice.py
        run: python tools/build_practice.py --check
      - name: Примеры Django в настоящем проекте
        run: python tools/check_django.py
      - name: Полный код первого проекта совпадает со страницей и проходит тесты
        run: |
          python tools/sync_examples.py --check
          cd examples/flask-todo && python -m unittest test_app && cd ../django-todo && python manage.py test
      - name: Переводы kk/ и en/ не отстали от русских страниц
        run: python tools/translate.py check
      - name: Версия кэша service worker актуальна
        run: python tools/build_sw.py --check
      - name: Индекс поиска актуален
        run: |
          python tools/build_search.py
          git diff --exit-code assets/search-index.js assets/search-index.kk.js assets/search-index.en.js
