# Публикация на GitHub Pages со сборкой поиска Pagefind.
# Включается один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Пока там выбрано «Deploy from a branch», сайт публикуется как раньше, а поиск
# работает на старом индексе assets/search-index*.js.
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Сайт публикуется только после успешных проверок
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Индекс поиска Pagefind
        run: npx -y pagefind@1.4.0 --site .
      - name: Служебные папки не публикуются
        run: |
          rm -rf .git .github tools docs README.txt
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
